# Copy to dep-review.properties and customize for your organization.
# Gate: INFO, LOW, MEDIUM, HIGH, CRITICAL or NONE.
failOn=HIGH
online=true

# CONFIGURED: verify .asc when the metadata/config pins a key or a keyring is supplied.
# ALL: attempt PGP verification for every changed artifact.
# NONE: checksum/provenance review only.
signature.mode=CONFIGURED

# If a checksum sidecar for the requested algorithm is absent, download the artifact and
# compute the digest independently. Set false if artifacts are too large for CI.
downloadMissingArtifacts=true
timeoutSeconds=20
parallelism=4

# Repositories are tried in declaration order, with internal repositories prioritized for
# coordinates under internalGroupPrefixes. Maven Central is added unless explicitly disabled.
repositories=central,internal

mavenCentral.enabled=true
mavenCentral.url=https://repo1.maven.org/maven2/

repo.internal.url=https://nexus.example.com/repository/maven-public/
repo.internal.internal=true
# Credentials are read from environment variable names, never literal values.
repo.internal.usernameEnv=NEXUS_USERNAME
repo.internal.passwordEnv=NEXUS_PASSWORD

# Comma-separated group prefixes owned by the company. Central 404 for these is "internal",
# not dependency-confusion by default.
internalGroupPrefixes=com.example,com.example.platform

# Additional source hosts accepted when a custom/source URL or URL-bearing origin is changed.
allowedSourceHosts=repo1.maven.org,nexus.example.com,plugins.gradle.org,dl.google.com

# Full 40-hex PGP fingerprints, comma-separated.
trustedPgpFingerprints=

# Optional isolated GPG keyring exported from gradle/verification-keyring.keys:
# gpg --no-default-keyring --keyring trusted.kbx --import gradle/verification-keyring.keys
gpg.executable=gpg
gpg.keyring=

# Narrow exceptions. Key is either group or group:artifact. Prefer group:artifact.
# policy.repackaged.coordinate=com.example:repackaged-client
# policy.repackaged.allowRepositorySpecificArtifact=true
# policy.repackaged.allowedRepositories=internal
# policy.repackaged.trustedFingerprints=0123456789ABCDEF0123456789ABCDEF01234567
# policy.repackaged.reason=Internal reproducible rebuild strips deployment timestamps

