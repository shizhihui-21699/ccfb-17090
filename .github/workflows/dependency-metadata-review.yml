name: Dependency metadata review

on:
  pull_request:
    paths:
      - "gradle/verification-metadata.xml"
      - "gradle/verification-keyring.keys"
      - "**/build.gradle"
      - "**/build.gradle.kts"
      - "**/pom.xml"
      - "**/libs.versions.toml"
      - ".github/dependency-review.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare MR inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/review
          BASE="${{ github.event.pull_request.base.sha || github.sha }}~1"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          METADATA=gradle/verification-metadata.xml

          git diff --unified=80 "$BASE...$HEAD" -- "$METADATA" > build/review/metadata.patch || true
          git diff --unified=20 "$BASE...$HEAD" -- \
            '**/build.gradle' '**/build.gradle.kts' '**/pom.xml' \
            '**/libs.versions.toml' '**/gradle.properties' > build/review/build.patch || true

          if git cat-file -e "$BASE:$METADATA" 2>/dev/null; then
            git show "$BASE:$METADATA" > build/review/base-verification.xml
          else
            printf '%s\n' '<?xml version="1.0"?><verification-metadata/>' \
              > build/review/base-verification.xml
          fi

      - name: Build reviewer
        run: ./gradlew installDist --no-daemon

      - name: Review dependency metadata
        shell: bash
        run: |
          set +e
          CONFIG_ARGS=()
          if [[ -f .github/dependency-review.properties ]]; then
            CONFIG_ARGS=(--config .github/dependency-review.properties)
          fi

          ./build/install/dependency-metadata-review/bin/dependency-metadata-review \
            --base build/review/base-verification.xml \
            --head gradle/verification-metadata.xml \
            --metadata-patch build/review/metadata.patch \
            --build-patch build/review/build.patch \
            "${CONFIG_ARGS[@]}" \
            --format markdown \
            --output build/review/report.md
          code=$?

          cat build/review/report.md >> "$GITHUB_STEP_SUMMARY"
          echo "review-exit-code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
